[package]
name = "shirei-memory-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "shirei_memory_core"
path = "src/lib.rs"

[dependencies]
git2 = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[dev-dependencies]
tempfile = "3"
