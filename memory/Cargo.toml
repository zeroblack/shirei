[package]
name = "shirei-memory"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "shirei-memory"
path = "src/main.rs"

[dependencies]
shirei-memory-core = { path = "../memory-core" }
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["macros", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[dev-dependencies]
rmcp = { version = "3", features = ["client", "transport-child-process"] }
tempfile = "3"
